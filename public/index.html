<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Evaluación Diagnóstica y de Seguimiento – Nivel Primario</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--az:#0b3d91;--az2:#1e63d6;--rj:#c8102e;--bg:#f4f6fb;--tx:#0f172a;--mu:#64748b;--E:#ef4444;--A:#f59e0b;--S:#10b981}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(120deg,var(--az),var(--az2));color:#fff;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}header select,header button{border:0;border-radius:10px;padding:8px 12px;font:inherit}
main{max-width:1250px;margin:auto;padding:24px}.hero{text-align:center;padding:40px 10px}.hero h2{font-size:34px;margin:.2em 0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 24px #0b3d9114;border:1px solid #e2e8f0}
.card.big{cursor:pointer;transition:.2s;padding:34px}.card.big:hover{transform:translateY(-4px);box-shadow:0 14px 36px #0b3d9126}
.pill{display:inline-block;background:#e0e9ff;color:var(--az);border-radius:99px;padding:3px 10px;font-size:12px;margin:2px;cursor:pointer;border:0}
.btn{background:var(--az2);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.btn.sec{background:#e2e8f0;color:var(--tx)}
.bar{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--S)}
table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}th,td{border:1px solid #94a3b8;padding:4px 5px;text-align:center}
th{background:#dbe5f7}td.n{text-align:left;min-width:190px}.of th{background:#fff}
.chk{cursor:pointer;width:26px;height:22px}.chk.on.E{background:#fecaca}.chk.on.A{background:#fde68a}.chk.on.S{background:#a7f3d0}
.rub td{text-align:left;vertical-align:top}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:0;background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}.tabs button.on{background:var(--az);color:#fff}
.kpi{font-size:30px;font-weight:800;color:var(--az)}.mu{color:var(--mu);font-size:13px}.warn{color:var(--rj);font-weight:600}
.doc{background:#fff;padding:28px;margin:16px 0}.doc h3{text-align:center;margin:4px}.fld{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input{border:1px solid #cbd5e1;border-radius:8px;padding:7px;font:inherit;width:100%}
@media print{header,.noprint{display:none!important}main{padding:0;max-width:none}.card,.doc{box-shadow:none;border:0;break-inside:avoid}body{background:#fff}.pb{break-after:page}}
</style></head>
<body><header><h1>MINERD · Evaluación del Nivel Primario <span id="hc"></span></h1>
<select id="periodo"></select><button id="home">Inicio</button><button id="coord">Coordinación</button></header>
<main id="app"></main>
<script type="module" src="app.js"></script></body></html>
